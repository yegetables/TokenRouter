name: Dev Image

# Pushes only the :dev tag and never touches :latest.
#
# Why this must stay separate from release.yml: on a v* tag, release.yml has
# GoReleaser push a multi-arch manifest for :<Version>, :<Major.Minor>,
# :<Major> and :latest together. Production runs pull_policy: always, so one
# v* tag push makes the next compose up upgrade it. Work in progress has to
# ship as :dev, which means it must avoid that path.
#
# The upstream Dockerfile is a self-contained multi-stage build (it runs the
# frontend pnpm build and the Go build itself), so no GoReleaser prebuilt
# artifacts are needed here.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source to build: branch, tag or commit SHA (empty = the branch that dispatches it)'
        required: false
        type: string
        default: ''
      version_suffix:
        description: 'Version suffix (empty = dev.<short sha>), to tell dev builds apart in the admin panel'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

# Serialize: two dev builds pushing the same tag would overwrite each other.
concurrency:
  group: dev-image

jobs:
  dev-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve image and version
        id: meta
        run: |
          set -euo pipefail
          # Version and revision must come from the checked-out commit: on
          # workflow_dispatch, github.sha is the commit of the dispatching
          # branch, not of the built content.
          revision="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          base_version="$(tr -d '[:space:]' < backend/cmd/server/VERSION)"
          suffix="${{ github.event.inputs.version_suffix }}"
          if [ -z "$suffix" ]; then
            suffix="dev.${short_sha}"
          fi
          # GHCR rejects the push unless the repository name is all lowercase.
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=${image}"
            echo "version=${base_version}-${suffix}"
            echo "revision=${revision}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${image}:dev (version ${base_version}-${suffix}, revision ${revision})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # The deploy host is x86_64; amd64 alone keeps the build short and dev
          # does not need multiple architectures.
          platforms: linux/amd64
          push: true
          # Only :dev appears here. Never add :latest.
          tags: ${{ steps.meta.outputs.image }}:dev
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      - name: Summary
        run: |
          {
            echo "### Dev image pushed"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${{ steps.meta.outputs.image }}:dev\` |"
            echo "| Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Built commit | \`${{ steps.meta.outputs.revision }}\` |"
            echo
            echo "Update the dev instance:"
            echo
            echo '```bash'
            echo "cd ~/compose-all/1panel-compose/ai && docker compose up -d --pull always"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
